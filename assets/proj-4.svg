<g class="up t3"><text class="mono body" x="24" y="112" font-size="12.5">Hold a key, speak, release. Polished text lands at your</text><text class="mono body" x="24" y="131" font-size="12.5">cursor in any Windows app. Local Whisper, so audio never</text><text class="mono body" x="24" y="150" font-size="12.5">leaves the machine.</text></g>
