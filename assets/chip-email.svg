<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 82 34" width="82" height="34" role="img" aria-label="EMAIL">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0c10"/><stop offset="1" stop-color="#08080a"/></linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#f2ede4" fill-opacity="0.05"/></pattern>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .bone{fill:#f2ede4}.accent{fill:#4da3ff}.dim{fill:#8d8a93}.body{fill:#a9a5ae}
    .d{animation:bl 2.2s ease-in-out infinite}
    @keyframes bl{0%,100%{opacity:.45}50%{opacity:1}}
    @media (prefers-reduced-motion: reduce){.d{animation:none}}
  </style>
</defs>
<rect width="82" height="34" rx="9" fill="url(#bg)"/><rect width="82" height="34" rx="9" fill="url(#dots)"/><rect x="0.5" y="0.5" width="81" height="33" rx="9" fill="none" stroke="#22222a"/>
<circle class="d" cx="17" cy="17" r="3.6" fill="#4da3ff"/>
<text class="mono bone" x="28" y="21.5" font-size="12" letter-spacing="1.4">EMAIL</text>
</svg>