<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Aadit - full-stack developer and UI/UX designer, BITS Pilani Dubai">
<defs>
  <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0b0e"/><stop offset="0.55" stop-color="#101014"/><stop offset="1" stop-color="#08080a"/>
  </linearGradient>
  <radialGradient id="warm" cx="0.5" cy="0.5" r="0.62">
    <stop offset="0" stop-color="#ff5a1f" stop-opacity="0.20"/>
    <stop offset="0.55" stop-color="#ff5a1f" stop-opacity="0.05"/>
    <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="fade" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
    <stop offset="0.6" stop-color="#fff" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="gridmask"><rect width="1200" height="460" fill="url(#fade)"/></mask>

  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0V48H0" fill="none" stroke="#f2ede4" stroke-opacity="0.075" stroke-width="1"/>
  </pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#000" fill-opacity="0.22"/>
  </pattern>

  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#fff" stop-opacity="1"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>

  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>

  <g id="wordmark">
    <path pathLength="1" d="M6 140L50 4L94 140M26 96H74"/>
    <path pathLength="1" transform="translate(124,0)" d="M6 140L50 4L94 140M26 96H74"/>
    <path pathLength="1" transform="translate(248,0)" d="M20 6H52C84 6 96 36 96 72C96 108 84 138 52 138H20Z"/>
    <path pathLength="1" transform="translate(372,0)" d="M20 6V138"/>
    <path pathLength="1" transform="translate(436,0)" d="M8 10H92M50 10V138"/>
  </g>

  <mask id="nameMask">
    <g transform="translate(346,150) scale(0.95)" fill="none" stroke="#fff" stroke-width="11.5"
       stroke-linecap="round" stroke-linejoin="round"><use href="#wordmark"/></g>
  </mask>

  <clipPath id="tcB"><rect x="1027" y="421" width="8" height="20"/></clipPath>
  <clipPath id="tcA"><rect x="1035" y="421" width="8" height="20"/></clipPath>

  <clipPath id="c1"><rect class="clip r1" x="360" y="334" width="495" height="34"/></clipPath>
  <clipPath id="c2"><rect class="clip r2" x="336" y="334" width="543" height="34"/></clipPath>
  <clipPath id="c3"><rect class="clip r3" x="360" y="334" width="495" height="34"/></clipPath>

  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .bone{fill:#f2ede4}.amber{fill:#ff5a1f}.dim{fill:#8d8a93}

    .lb{fill:#000}
    .lbT{transform-box:fill-box;transform-origin:top;animation:lbO 1.15s cubic-bezier(.16,.9,.2,1) both}
    .lbB{transform-box:fill-box;transform-origin:bottom;animation:lbO 1.15s cubic-bezier(.16,.9,.2,1) both}
    @keyframes lbO{0%{transform:scaleY(3.9)}100%{transform:scaleY(1)}}

    .wm{fill:none;stroke:#f2ede4;stroke-width:11.5;stroke-linecap:round;stroke-linejoin:round}
    .wm path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.25s cubic-bezier(.4,0,.2,1) both}
    @keyframes draw{to{stroke-dashoffset:0}}
    .wm path:nth-child(1){animation-delay:.45s}
    .wm path:nth-child(2){animation-delay:.58s}
    .wm path:nth-child(3){animation-delay:.71s}
    .wm path:nth-child(4){animation-delay:.84s}
    .wm path:nth-child(5){animation-delay:.97s}
    .nameglow{animation:glowin 1.6s ease-out 1.5s both}
    @keyframes glowin{0%{filter:drop-shadow(0 0 0 rgba(255,90,31,0))}100%{filter:drop-shadow(0 0 24px rgba(255,90,31,.32))}}

    .swp{animation:swp 9.5s cubic-bezier(.35,0,.25,1) 2.1s infinite}
    @keyframes swp{0%{transform:translateX(-300px)}17%{transform:translateX(1300px)}100%{transform:translateX(1300px)}}

    .rule{transform-box:fill-box;transform-origin:center;animation:rule .9s cubic-bezier(.16,.9,.2,1) 1.8s both}
    @keyframes rule{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}

    .fadeup{animation:fadeup .8s cubic-bezier(.16,.9,.2,1) both}
    @keyframes fadeup{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
    .d1{animation-delay:1.3s}.d3{animation-delay:1.75s}

    .clip{transform-box:fill-box;transform-origin:left center}
    .line{opacity:0}
    .l-1{animation:slot 11.4s linear 2.35s infinite}
    .l-2{animation:slot 11.4s linear 6.15s infinite}
    .l-3{animation:slot 11.4s linear 9.95s infinite}
    @keyframes slot{0%{opacity:1}27.2%{opacity:1}29.6%{opacity:0}100%{opacity:0}}

    .r1{animation:ty1 11.4s steps(40,end) 2.35s infinite}
    .r2{animation:ty2 11.4s steps(44,end) 6.15s infinite}
    .r3{animation:ty3 11.4s steps(40,end) 9.95s infinite}
    @keyframes ty1{0%{transform:scaleX(0)}11%{transform:scaleX(1)}100%{transform:scaleX(1)}}
    @keyframes ty2{0%{transform:scaleX(0)}12%{transform:scaleX(1)}100%{transform:scaleX(1)}}
    @keyframes ty3{0%{transform:scaleX(0)}11%{transform:scaleX(1)}100%{transform:scaleX(1)}}

    .cg1{animation:cur1 11.4s steps(40,end) 2.35s infinite}
    .cg2{animation:cur2 11.4s steps(44,end) 6.15s infinite}
    .cg3{animation:cur3 11.4s steps(40,end) 9.95s infinite}
    @keyframes cur1{0%{transform:translateX(0)}11%{transform:translateX(480px)}100%{transform:translateX(480px)}}
    @keyframes cur2{0%{transform:translateX(0)}12%{transform:translateX(528px)}100%{transform:translateX(528px)}}
    @keyframes cur3{0%{transform:translateX(0)}11%{transform:translateX(480px)}100%{transform:translateX(480px)}}
    .curbar{fill:#ff5a1f;animation:blink 1s steps(1,end) infinite}
    @keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:.15}}

    .rec{animation:rec 1.6s steps(1,end) infinite}
    @keyframes rec{0%,55%{opacity:1}55.01%,100%{opacity:.12}}
    .digA{animation:roll .42s steps(10,end) infinite}
    .digB{animation:roll 4.2s steps(10,end) infinite}
    @keyframes roll{0%{transform:translateY(0)}100%{transform:translateY(-200px)}}

    .grain{animation:flick .5s steps(2,end) infinite}
    @keyframes flick{0%{opacity:.055}100%{opacity:.085}}

    @media (prefers-reduced-motion: reduce){
      .wm path,.lbT,.lbB,.rule,.fadeup,.line,.clip,.cg1,.cg2,.cg3,.swp,.grain,.digA,.digB,.rec,.curbar,.nameglow{animation:none!important}
      .wm path{stroke-dashoffset:0}
      .line{opacity:0}.l-1{opacity:1}
      .cg1{transform:translateX(480px)}
      .swp{opacity:0}
    }
  </style>
</defs>

<rect width="1200" height="460" fill="url(#bgg)"/>
<rect width="1200" height="460" fill="url(#warm)"/>
<g mask="url(#gridmask)"><rect width="1200" height="460" fill="url(#grid)"/></g>
<rect width="1200" height="460" fill="url(#scan)"/>

<g stroke="#f2ede4" stroke-opacity=".26" stroke-width="1.5" fill="none" class="fadeup d1">
  <path d="M34 100 V84 H50"/><path d="M1166 100 V84 H1150"/>
  <path d="M34 376 V392 H50"/><path d="M1166 376 V392 H1150"/>
</g>

<g class="fadeup d1">
  <text class="mono amber" x="600" y="128" font-size="12" letter-spacing="6.5" text-anchor="middle">BITS PILANI DUBAI</text>
</g>

<g class="nameglow">
  <g class="wm" transform="translate(346,150) scale(0.95)"><use href="#wordmark"/></g>
</g>
<g mask="url(#nameMask)" style="mix-blend-mode:screen">
  <g class="swp"><rect x="0" y="140" width="240" height="160" fill="url(#sweep)" opacity=".85"/></g>
</g>

<rect class="rule" x="490" y="308" width="220" height="2" fill="#ff5a1f"/>

<g class="line l-1">
  <g clip-path="url(#c1)"><text class="mono bone" x="360" y="356" font-size="20">full-stack dev &#183; ui/ux &#183; design-obsessed</text></g>
  <g class="cg1"><rect class="curbar" x="360" y="338" width="11" height="23"/></g>
</g>
<g class="line l-2">
  <g clip-path="url(#c2)"><text class="mono bone" x="336" y="356" font-size="20">i make things that feel as good as they work</text></g>
  <g class="cg2"><rect class="curbar" x="336" y="338" width="11" height="23"/></g>
</g>
<g class="line l-3">
  <g clip-path="url(#c3)"><text class="mono bone" x="360" y="356" font-size="20">currently building a cinematic portfolio</text></g>
  <g class="cg3"><rect class="curbar" x="360" y="338" width="11" height="23"/></g>
</g>

<rect class="grain" width="1200" height="460" filter="url(#grain)" opacity=".07" style="mix-blend-mode:overlay"/>

<rect class="lb lbT" x="0" y="0" width="1200" height="58"/>
<rect class="lb lbB" x="0" y="402" width="1200" height="58"/>

<g class="fadeup d3">
  <circle class="rec" cx="66" cy="434" r="5" fill="#ff5a1f"/>
  <text class="mono dim" x="80" y="438" font-size="12" letter-spacing="2.5">REC</text>
  <text class="mono dim" x="128" y="438" font-size="12" letter-spacing="2.5">24FPS &#183; 2.39:1</text>
  <text class="mono dim" x="962" y="438" font-size="12">TC 00:01:</text>
  <g clip-path="url(#tcB)"><g class="digB"><text class="mono dim" x="1027" y="437" font-size="12">0</text><text class="mono dim" x="1027" y="457" font-size="12">1</text><text class="mono dim" x="1027" y="477" font-size="12">2</text><text class="mono dim" x="1027" y="497" font-size="12">3</text><text class="mono dim" x="1027" y="517" font-size="12">4</text><text class="mono dim" x="1027" y="537" font-size="12">5</text><text class="mono dim" x="1027" y="557" font-size="12">6</text><text class="mono dim" x="1027" y="577" font-size="12">7</text><text class="mono dim" x="1027" y="597" font-size="12">8</text><text class="mono dim" x="1027" y="617" font-size="12">9</text><text class="mono dim" x="1027" y="637" font-size="12">0</text></g></g>
  <g clip-path="url(#tcA)"><g class="digA"><text class="mono dim" x="1035" y="437" font-size="12">0</text><text class="mono dim" x="1035" y="457" font-size="12">1</text><text class="mono dim" x="1035" y="477" font-size="12">2</text><text class="mono dim" x="1035" y="497" font-size="12">3</text><text class="mono dim" x="1035" y="517" font-size="12">4</text><text class="mono dim" x="1035" y="537" font-size="12">5</text><text class="mono dim" x="1035" y="557" font-size="12">6</text><text class="mono dim" x="1035" y="577" font-size="12">7</text><text class="mono dim" x="1035" y="597" font-size="12">8</text><text class="mono dim" x="1035" y="617" font-size="12">9</text><text class="mono dim" x="1035" y="637" font-size="12">0</text></g></g>
</g>
</svg>
